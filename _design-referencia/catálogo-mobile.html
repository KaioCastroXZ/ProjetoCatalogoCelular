<div style="width: 390px; height: 3000px; display: flex; flex-direction: column; background: #FBF8F5; color: #141110; font-family: 'Figtree', system-ui, sans-serif; overflow: hidden">

<header style="display: flex; align-items: center; justify-content: space-between; height: 64px; flex-shrink: 0; padding: 0 12px 0 20px; background: #FBF8F5; border-bottom: 1px solid #E8E0D9">
<a href="Home-Mobile.dc.html" aria-label="KALF STORE, página inicial" style="display: flex; align-items: center; gap: 8px; color: #141110; text-decoration: none"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FE6B01"></span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; font-weight: 800; letter-spacing: -0.02em">KALF STORE</span></a>

<a href="#whatsapp" aria-label="Falar no WhatsApp" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; background: #FE6B01; color: #141110"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.6A8.4 8.4 0 1 1 21 11.5z"></path></svg></a>
<a href="Menu-Mobile.dc.html" aria-label="Abrir menu" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 999px; color: #141110"><svg aria-hidden="true" width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></a>

<span style="font-size: 14px; color: #6B625B">[N] aparelhos</span>
</div>
<label style="display: flex; align-items: center; gap: 10px; height: 52px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #E8E0D9; color: #6B625B"><svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input type="search" aria-label="Buscar por nome" placeholder="Buscar por nome" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; color: #141110"></label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Filtros-Mobile.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 999px; background: #141110; color: #FFFFFF; font-size: 15px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Filtros · 1</a>
<label style="display: flex; align-items: center; height: 48px; box-sizing: border-box; padding: 0 12px 0 16px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #E8E0D9"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ordenar</span><sc-raw-select style="width: 100%; height: 44px; border: 0; background: transparent; font-family: 'Figtree', system-ui, sans-serif; font-size: 15px; font-weight: 700; color: #141110"><option>Mais recentes</option><option>Menor preço</option><option>Maior preço</option></sc-raw-select></label>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto">
<button type="button" aria-label="Remover filtro Apple" style="display: flex; align-items: center; gap: 6px; height: 36px; flex-shrink: 0; padding: 0 12px 0 14px; border-radius: 999px; border: 0; background: #FFF1E6; color: #8A3700; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; font-weight: 600">Apple<svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>

</div>
</section>

<section style="padding: 8px 20px 24px">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{cards}}" as="item" hint-placeholder-count="8">
<article style="display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(20,17,16,0.06), 0 8px 24px rgba(20,17,16,0.06); min-width: 0">
<a href="Produto-Mobile.dc.html" aria-label="Ver {{item.name}}" style="position: relative; display: flex; align-items: center; justify-content: center; aspect-ratio: 4 / 5; background: #F3EEE9; border-radius: 14px; overflow: hidden; text-decoration: none">
<sc-if value="{{item.hasPhoto}}" hint-placeholder-val="{{ true }}"><div style="width: 40%; aspect-ratio: 9 / 19; box-sizing: border-box; padding: 3px; background: #141110; border-radius: 12px; opacity: {{item.dim}}"><div style="width: 100%; height: 100%; border-radius: 9px; background: {{item.screen}}"></div></div></sc-if>
<sc-if value="{{item.noPhoto}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="display: flex; align-items: center; gap: 6px; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 16px; font-weight: 800"><span style="width: 9px; height: 9px; border-radius: 2px; background: #FE6B01"></span>KALF STORE</span><span style="font-size: 12px; color: #6B625B">Foto em breve</span></div></sc-if>
<sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{ false }}"><span style="position: absolute; top: 8px; left: 8px; display: flex; align-items: center; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; background: {{item.badgeBg}}; color: {{item.badgeFg}}">{{item.badge}}</span></sc-if>
</a>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 4px; opacity: {{item.dim}}">
<h3 style="margin: 0; min-height: 36px; font-size: 14px; line-height: 1.3; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{item.name}}</h3>
<span style="font-size: 12px; color: #6B625B; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.specs}}</span>
</div>
<div style="display: flex; flex-direction: column; justify-content: flex-end; gap: 1px; min-height: 54px; padding: 0 4px; opacity: {{item.dim}}">
<sc-if value="{{item.hasOld}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; color: #6B625B; text-decoration: line-through">R$ [PREÇO ANTIGO]</span></sc-if>
<span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: {{item.priceSize}}; font-weight: 800; line-height: 1.15">{{item.price}}</span>
<sc-if value="{{item.hasInst}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; color: #6B625B">ou [X]x de R$ [VALOR]</span></sc-if>
</div>
<sc-if value="{{item.available}}" hint-placeholder-val="{{ true }}"><a href="#whatsapp" style="display: flex; align-items: center; justify-content: center; gap: 6px; height: 44px; border-radius: 999px; background: #141110; color: #FFFFFF; font-size: 14px; font-weight: 700; text-decoration: none"><svg aria-hidden="true" width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.3 7.5L3 21l2-5.6A8.4 8.4 0 1 1 21 11.5z"></path></svg>WhatsApp</a></sc-if>
<sc-if value="{{item.sold}}" hint-placeholder-val="{{ false }}"><button type="button" disabled="" style="height: 44px; border: 0; border-radius: 999px; background: #EDE6E0; color: #8F857E; font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; font-weight: 700">Vendido</button></sc-if>
</article>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 20px 56px">
<span style="font-size: 13px; color: #6B625B">Mostrando 8 de [N] aparelhos</span>
<button type="button" style="width: 100%; height: 52px; border-radius: 999px; border: 2px solid #141110; background: transparent; color: #141110; font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; font-weight: 700">Carregar mais</button>
</section>

<footer style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px; padding: 40px 20px; background: #141110; color: #FFFFFF">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FE6B01"></span><span style="font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; font-weight: 800">KALF STORE</span></span>
<span style="font-size: 14px; line-height: 1.5; color: #C9C0B8">Rodapé igual ao da Home mobile.</span>
</footer>
</div>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:3000}}">
class Component extends DCLogic {
  renderVals() {
    const B = { novo: ['Novo', '#141110', '#FFFFFF'], semi: ['Seminovo', '#FFF1E6', '#8A3700'], dest: ['Destaque', '#FE6B01', '#141110'], vend: ['Vendido', '#141110', '#FFFFFF'] };
    const card = (o) => { const b = o.badge ? B[o.badge] : null; const sold = o.badge === 'vend'; return { name: o.name, specs: o.specs, screen: o.screen || '#FE6B01', hasPhoto: !o.noPhoto, noPhoto: !!o.noPhoto, hasBadge: !!b, badge: b ? b[0] : '', badgeBg: b ? b[1] : '', badgeFg: b ? b[2] : '', hasOld: !!o.old, hasInst: !!o.inst, price: o.noPrice ? 'Consulte o preço' : 'R$ [PREÇO]', priceSize: o.noPrice ? '15px' : '19px', available: !sold, sold: sold, dim: sold ? '0.45' : '1' }; };
    return { cards: [
      { name: 'iPhone 15 128GB [EXEMPLO]', specs: '128 GB · Preto', badge: 'novo', screen: '#141110', inst: true },
      { name: 'iPhone 13 128GB [EXEMPLO]', specs: '128 GB · Meia-noite', badge: 'semi', screen: '#FE6B01', inst: true },
      { name: 'iPhone 14 Pro 256GB [EXEMPLO]', specs: '256 GB · Roxo-profundo', badge: 'dest', screen: '#6B625B', old: true },
